version: '3.8'

services:
  yolox:
    build: 
      context: .
      dockerfile: Dockerfile

    image: yolox:24.03 
    container_name: yolox_container

    ipc: host

    volumes:
    - "${DATASET_PATH}:/workspace/YOLOX/datasets"
    - "./exps:/workspace/YOLOX/exps"
    - "./outputs:/workspace/YOLOX/YOLOX_outputs"
    environment:
      - PYTHONPATH=/workspace/YOLOX
    command: python tools/train.py -f exps/yolox_config.py -b 16 --devices 0
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    stdin_open: true
    tty: true